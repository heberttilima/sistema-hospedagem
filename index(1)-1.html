<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Hospedagem</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f5f7; margin: 0; padding: 20px; color: #222; }
    main { max-width: 760px; margin: 25px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 3px 14px #00000012; }
    h1 { text-align: center; margin-top: 0; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input { width: 100%; padding: 11px; border: 1px solid #cbd0d6; border-radius: 7px; font-size: 16px; }
    button { border: 0; border-radius: 7px; padding: 11px 16px; cursor: pointer; font-size: 15px; }
    .save { margin-top: 18px; width: 100%; background: #1769aa; color: white; font-weight: bold; }
    .delete { background: #c62828; color: white; }
    .entry { border: 1px solid #e0e3e7; border-radius: 8px; padding: 14px; margin-top: 12px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .details { line-height: 1.6; overflow-wrap: anywhere; }
    .empty { color: #666; text-align: center; padding: 20px 0; }
    @media (max-width: 520px) { .entry { align-items: stretch; flex-direction: column; } .delete { width: 100%; } }
  </style>
</head>
<body>
<main>
  <h1>Sistema de Hospedagem</h1>
  <form id="formHospedagem">
    <label for="local">Local</label>
    <input id="local" name="local" type="text" required placeholder="Digite o local">

    <label for="hospede">Nome do hóspede</label>
    <input id="hospede" name="hospede" type="text" required placeholder="Digite o nome do hóspede">

    <label for="entrada">Data de entrada</label>
    <input id="entrada" name="entrada" type="date" required>

    <label for="saida">Data de saída</label>
    <input id="saida" name="saida" type="date" required>

    <button class="save" type="submit">Cadastrar hospedagem</button>
  </form>

  <h2>Hospedagens cadastradas</h2>
  <section id="lista" aria-live="polite"></section>
</main>

<script>
  const CHAVE = "hospedagens";
  const form = document.getElementById("formHospedagem");
  const lista = document.getElementById("lista");

  function obterHospedagens() {
    return JSON.parse(localStorage.getItem(CHAVE) || "[]");
  }

  function salvarHospedagens(hospedagens) {
    localStorage.setItem(CHAVE, JSON.stringify(hospedagens));
  }

  function formatarData(data) {
    if (!data) return "";
    const [ano, mes, dia] = data.split("-");
    return `${dia}/${mes}/${ano}`;
  }

  function mostrarHospedagens() {
    const hospedagens = obterHospedagens();
    lista.replaceChildren();

    if (hospedagens.length === 0) {
      const aviso = document.createElement("p");
      aviso.className = "empty";
      aviso.textContent = "Nenhuma hospedagem cadastrada.";
      lista.appendChild(aviso);
      return;
    }

    hospedagens.forEach((item, indice) => {
      const card = document.createElement("article");
      card.className = "entry";

      const detalhes = document.createElement("div");
      detalhes.className = "details";
      const local = document.createElement("strong");
      local.textContent = item.local;
      const hospede = document.createElement("div");
      hospede.textContent = "Hóspede: " + item.hospede;
      const datas = document.createElement("div");
      datas.textContent = `Entrada: ${formatarData(item.entrada)} | Saída: ${formatarData(item.saida)}`;
      detalhes.append(local, hospede, datas);

      const botao = document.createElement("button");
      botao.className = "delete";
      botao.type = "button";
      botao.textContent = "Excluir";
      botao.addEventListener("click", () => excluirHospedagem(indice));

      card.append(detalhes, botao);
      lista.appendChild(card);
    });
  }

  function excluirHospedagem(indice) {
    if (!confirm("Deseja realmente excluir esta hospedagem?")) return;
    const hospedagens = obterHospedagens();
    hospedagens.splice(indice, 1);
    salvarHospedagens(hospedagens);
    mostrarHospedagens();
  }

  form.addEventListener("submit", (evento) => {
    evento.preventDefault();
    const local = document.getElementById("local").value.trim();
    const hospede = document.getElementById("hospede").value.trim();
    const entrada = document.getElementById("entrada").value;
    const saida = document.getElementById("saida").value;

    if (saida <= entrada) {
      alert("A data de saída deve ser posterior à data de entrada.");
      return;
    }

    const hospedagens = obterHospedagens();
    hospedagens.push({ local, hospede, entrada, saida });
    salvarHospedagens(hospedagens);
    form.reset();
    mostrarHospedagens();
  });

  mostrarHospedagens();
</script>
</body>
</html>

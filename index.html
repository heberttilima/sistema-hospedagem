<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Hospedagem</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f5f4;
  margin: 0;
  padding: 16px;
  color: #17212b;
}

main {
  max-width: 850px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 3px 15px #0001;
}

h1 { color: #176b55; }

label {
  display: block;
  margin: 12px 0 5px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd5d9;
  border-radius: 7px;
  box-sizing: border-box;
  font-size: 16px;
}

button {
  padding: 11px 15px;
  border: 0;
  border-radius: 7px;
  background: #16785d;
  color: white;
  margin: 8px 5px 0 0;
  font-size: 15px;
}

.danger { background: #b83232; }

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

#status {
  background: #eef5f2;
  padding: 10px;
  border-radius: 7px;
}

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

td, th {
  text-align: left;
  padding: 9px;
  border-bottom: 1px solid #e1e7e9;
}

th {
  background: #eef5f2;
}

@media(max-width:550px) {
  .row { grid-template-columns: 1fr; }
  main { padding: 14px; }
}
</style>
</head>

<body>

<main>

<h1>🏡 Sistema de Hospedagem</h1>

<p>Controle de hospedagens.</p>

<div id="status">Conectando ao Supabase...</div>

<h2>Nova hospedagem</h2>

<form id="bookingForm">

<label>Local</label>
<input id="local" required maxlength="120">

<label>Nome do hóspede</label>
<input id="hospede" required maxlength="120">

<div class="row">

<div>
<label>Data de entrada</label>
<input id="entrada" type="date" required>
</div>

<div>
<label>Data de saída</label>
<input id="saida" type="date" required>
</div>

</div>

<button type="submit" id="saveButton">
Salvar hospedagem
</button>

</form>

<h2>Hospedagens cadastradas</h2>

<button type="button" onclick="loadRecords()">
Atualizar lista
</button>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Local</th>
<th>Hóspede</th>
<th>Entrada</th>
<th>Saída</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="records">
<tr>
<td colspan="5">Carregando...</td>
</tr>
</tbody>

</table>

</div>

</main>

<script>

const SUPABASE_URL =
'https://uszlvnqxbmbtwvkcoapc.supabase.co';

const SUPABASE_KEY =
'sb_publishable_hPyTHBbJEid_EEf2BggYaQ_xun4iV1M';

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function msg(text) {
document.getElementById('status').textContent = text;
}

function escapeHTML(value) {
return String(value ?? '').replace(/[&<>"']/g, c => ({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function formatDate(value) {
const [y,m,d] = value.split('-');
return d+'/'+m+'/'+y;
}

// LISTAR EM ORDEM DE LOCAL E DATA

async function loadRecords() {

msg('Atualizando hospedagens...');

const {data,error} = await db
.from('hospedagens')
.select('*')
.order('local', {ascending: true})
.order('entrada', {ascending: true});

if(error) {
msg('Erro ao carregar: '+error.message);
return;
}

if(data.length === 0) {

document.getElementById('records').innerHTML =
'<tr><td colspan="5">Nenhuma hospedagem cadastrada.</td></tr>';

msg('Conectado ao Supabase.');

return;
}

document.getElementById('records').innerHTML =
data.map(x => `
<tr>
<td>${escapeHTML(x.local)}</td>
<td>${escapeHTML(x.hospede)}</td>
<td>${formatDate(x.entrada)}</td>
<td>${formatDate(x.saida)}</td>
<td>
<button class="danger"
onclick="deleteRecord(${Number(x.id)})">
Excluir
</button>
</td>
</tr>
`).join('');

msg('Conectado ao Supabase. Lista atualizada.');

}

// EXCLUIR HOSPEDAGEM

async function deleteRecord(id) {

if(!confirm('Deseja excluir esta hospedagem?')) return;

const {error} = await db
.from('hospedagens')
.delete()
.eq('id',id);

if(error) {
msg('Erro ao excluir: '+error.message);
return;
}

msg('Hospedagem excluída.');

loadRecords();

}

// SALVAR HOSPEDAGEM

document.getElementById('bookingForm')
.addEventListener('submit', async function(e) {

e.preventDefault();

const local = document.getElementById('local').value.trim();
const hospede = document.getElementById('hospede').value.trim();
const entrada = document.getElementById('entrada').value;
const saida = document.getElementById('saida').value;

if(saida <= entrada) {
msg('A saída deve ser posterior à entrada.');
return;
}

const button = document.getElementById('saveButton');
button.disabled = true;

msg('Salvando hospedagem...');

const {error} = await db
.from('hospedagens')
.insert([{
local,
hospede,
entrada,
saida
}]);

button.disabled = false;

if(error) {
msg('Erro ao salvar: '+error.message);
return;
}

this.reset();

msg('Hospedagem salva com sucesso.');

loadRecords();

});

// INICIAR SISTEMA

async function start() {

try {

msg('Verificando conexão...');

await loadRecords();

} catch(error) {

msg('Falha na conexão: '+error.message);

}

}

start();

</script>

</body>
</html>

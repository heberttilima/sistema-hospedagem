<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema de Hospedagem</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f5f4;margin:0;padding:16px;color:#17212b}main{max-width:850px;margin:20px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001}h1{color:#176b55}label{display:block;margin:12px 0 5px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #ccd5d9;border-radius:7px;box-sizing:border-box;font-size:16px}button{padding:11px 15px;border:0;border-radius:7px;background:#16785d;color:white;margin:8px 5px 0 0;font-size:15px}button.secondary{background:#53636b}button.danger{background:#b83232}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}#app{display:none}#status{background:#eef5f2;padding:10px;border-radius:7px;white-space:pre-wrap}.muted{color:#63717a;font-size:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e1e7e9}@media(max-width:550px){.row{grid-template-columns:1fr}main{padding:14px}}
</style></head><body><main>
<h1>🏡 Sistema de Hospedagem</h1><p class="muted">Cadastros compartilhados entre usuários autorizados.</p><div id="status">Conectando...</div>
<section id="auth"><h2>Acesso</h2><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="login">Entrar</button><button id="signup" class="secondary">Criar conta</button><p class="muted">Se a confirmação de e-mail estiver ativa, confirme o e-mail antes de entrar.</p></section>
<section id="app"><p><b id="userLabel"></b> <button id="logout" class="secondary">Sair</button></p><h2>Nova hospedagem</h2><form id="bookingForm">
<label>Local</label><input id="local" required maxlength="120"><label>Nome do hóspede</label><input id="hospede" required maxlength="120"><div class="row"><div><label>Data de entrada</label><input id="entrada" type="date" required></div><div><label>Data de saída</label><input id="saida" type="date" required></div></div><button type="submit">Salvar hospedagem</button></form>
<h2>Hospedagens cadastradas</h2><div class="table-wrap"><table><thead><tr><th>Local</th><th>Hóspede</th><th>Entrada</th><th>Saída</th><th>Ação</th></tr></thead><tbody id="records"></tbody></table></div></section>
</main><script>
const URL='https://vpxagyzxftkvemfnsaup.supabase.co';
const KEY='sb_publishable_pajxD2L9LSY8ElTGgUOIQA_61zPmqCI';
const $=id=>document.getElementById(id);let channel=null;
if(!window.supabase || typeof window.supabase.createClient !== 'function'){
  msg('Não foi possível carregar a biblioteca do Supabase. Verifique a internet e tente novamente.');
  throw new Error('Biblioteca Supabase não carregada');
}
const db=window.supabase.createClient(URL,KEY);
function msg(t){$('status').textContent=t}
function dateFmt(v){let [y,m,d]=v.split('-');return d+'/'+m+'/'+y}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){let {data,error}=await db.from('hospedagens').select('*').order('entrada');if(error){msg('Erro ao carregar: '+error.message);return}
$('records').innerHTML=data.length?data.map(x=>`<tr><td>${esc(x.local)}</td><td>${esc(x.hospede)}</td><td>${dateFmt(x.entrada)}</td><td>${dateFmt(x.saida)}</td><td><button class="danger" onclick="delRecord(${Number(x.id)})">Excluir</button></td></tr>`).join(''):'<tr><td colspan="5">Nenhuma hospedagem cadastrada.</td></tr>'}
async function sessionView(s){$('auth').style.display=s?'none':'block';$('app').style.display=s?'block':'none';if(s){$('userLabel').textContent=s.user.email;await load();if(channel)await db.removeChannel(channel);channel=db.channel('hospedagens-live').on('postgres_changes',{event:'*',schema:'public',table:'hospedagens'},load).subscribe()}else{if(channel){await db.removeChannel(channel);channel=null}}}
window.delRecord=async id=>{if(!confirm('Excluir este registro?'))return;let {error}=await db.from('hospedagens').delete().eq('id',id);if(error)msg('Erro ao excluir: '+error.message);else{msg('Registro excluído.');load()}};
$('login').onclick=async()=>{let {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg('Erro ao entrar: '+error.message);else{msg('Login realizado.');sessionView(data.session)}};
$('signup').onclick=async()=>{if($('password').value.length<6){msg('A senha deve ter pelo menos 6 caracteres.');return}let {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)msg('Erro ao criar conta: '+error.message);else if(data.session){msg('Conta criada.');sessionView(data.session)}else msg('Conta criada. Confira seu e-mail para confirmar e depois entre.')};
$('logout').onclick=async()=>{let {error}=await db.auth.signOut();if(error)msg(error.message);else{msg('Você saiu.');sessionView(null)}};
$('bookingForm').onsubmit=async e=>{e.preventDefault();let local=$('local').value.trim(),hospede=$('hospede').value.trim(),entrada=$('entrada').value,saida=$('saida').value;if(saida<=entrada){msg('A saída deve ser posterior à entrada.');return}let {error}=await db.from('hospedagens').insert([{local,hospede,entrada,saida}]);if(error)msg('Erro ao salvar: '+error.message);else{$('bookingForm').reset();msg('Hospedagem salva.');load()}};
db.auth.onAuthStateChange((_e,s)=>{sessionView(s).catch(e=>msg('Erro ao abrir sessão: '+e.message))});
(async()=>{try{msg('Verificando conexão...');let {data,error}=await db.auth.getSession();if(error)msg('Erro de conexão: '+error.message);else{msg('Conectado ao Supabase.');await sessionView(data.session)}}catch(e){msg('Falha na conexão: '+(e.message||'verifique sua internet e as configurações do Supabase.'))}})();
</script></body></html>
